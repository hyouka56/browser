name: Browser Android build and emulator tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Browser APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI="$ANDROID_HOME/cmdline-tools/22.0/bin/android"
          test -x "$ANDROID_CLI"
          python3 -c "from pathlib import Path; import os; Path(os.environ['RUNNER_TEMP'] + '/android-sdk-licenses.txt').write_text('y\\n' * 1000)"
          "$ANDROID_CLI" --no-metrics sdk install --canary "platforms;android-37.0" "build-tools;37.0.0" platform-tools < "$RUNNER_TEMP/android-sdk-licenses.txt"

      - name: Run unit tests and build APKs
        run: gradle --no-daemon clean testEmulatorDebugUnitTest assembleEmulatorDebug assemblePhoneDebug assemblePhoneRelease

      - name: Verify APK native ABI contents and debug signature
        shell: bash
        run: |
          set -euo pipefail
          PHONE_DEBUG="app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          PHONE_RELEASE="app/build/outputs/apk/phone/release/app-phone-release-unsigned.apk"
          EMULATOR_DEBUG="app/build/outputs/apk/emulator/debug/app-emulator-debug.apk"
          python3 - <<'PY'
          from zipfile import ZipFile
          expected = {
              "app/build/outputs/apk/emulator/debug/app-emulator-debug.apk": ["x86_64"],
              "app/build/outputs/apk/phone/debug/app-phone-debug.apk": ["arm64-v8a"],
              "app/build/outputs/apk/phone/release/app-phone-release-unsigned.apk": ["arm64-v8a"],
          }
          for apk, expected_abis in expected.items():
              with ZipFile(apk) as archive:
                  abis = sorted({
                      path.split("/")[1]
                      for path in archive.namelist()
                      if path.startswith("lib/") and len(path.split("/")) > 2 and path.endswith(".so")
                  })
              if abis != expected_abis:
                  raise SystemExit(f"{apk}: expected {expected_abis}, found {abis}")
              print(f"{apk}: verified native ABI {abis}")
          PY
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$PHONE_DEBUG"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$PHONE_DEBUG" | grep -F "package: name='com.search.browser' versionCode='5' versionName='1.0.4'"

      - name: Upload installable ARM64 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-phone-ARM64-debug-signed
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug APK for emulator tests
        uses: actions/upload-artifact@v7
        with:
          name: Browser-debug-APK
          path: app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned production release APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-release-APK-unsigned
          path: app/build/outputs/apk/phone/release/app-phone-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Browser-unit-test-report
          path: app/build/reports/tests/testEmulatorDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  emulator-test:
    name: Browser runtime test on Android API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
          - api-level: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug APK
        uses: actions/download-artifact@v7
        with:
          name: Browser-debug-APK
          path: ${{ runner.temp }}/browser-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and test Browser
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            bash scripts/run-browser-emulator-test.sh "$RUNNER_TEMP/browser-apk/app-emulator-debug.apk" "${{ matrix.api-level }}"

      - name: Upload emulator screenshots, Logcat, and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Browser-emulator-API-${{ matrix.api-level }}-${{ github.run_id }}
          path: artifacts/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14

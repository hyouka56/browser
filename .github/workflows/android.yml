name: Browser Android build and emulator tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installable Browser APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Android CLI and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          command -v android
          android --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"

      - name: Validate adaptive dark-mode script syntax
        run: node --check app/src/main/assets/browser-dark-mode.js

      - name: Run unit tests and build installable APKs
        run: gradle --no-daemon clean testEmulatorDebugUnitTest assembleEmulatorDebug assemblePhoneDebug assembleArm64Debug

      - name: Verify package, version, ABI, and debug signature
        shell: bash
        run: |
          set -euo pipefail
          PHONE_DEBUG="app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          ARM64_DEBUG="app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          EMULATOR_DEBUG="app/build/outputs/apk/emulator/debug/app-emulator-debug.apk"
          test -s "$PHONE_DEBUG"
          test -s "$ARM64_DEBUG"
          test -s "$EMULATOR_DEBUG"
          python3 - "$PHONE_DEBUG" "$ARM64_DEBUG" "$EMULATOR_DEBUG" <<'PY'
          import sys
          from zipfile import ZipFile

          expected = {
              sys.argv[1]: ["armeabi-v7a"],
              sys.argv[2]: ["arm64-v8a"],
              sys.argv[3]: ["x86_64"],
          }
          for apk, expected_abis in expected.items():
              with ZipFile(apk) as archive:
                  abis = sorted({
                      path.split("/")[1]
                      for path in archive.namelist()
                      if path.startswith("lib/") and len(path.split("/")) > 2 and path.endswith(".so")
                  })
              if abis != expected_abis:
                  raise SystemExit(f"{apk}: expected {expected_abis}, found {abis}")
              print(f"{apk}: verified native ABI {abis}")
          PY
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$PHONE_DEBUG"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$ARM64_DEBUG"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$ARM64_DEBUG" | grep -F "package: name='com.search.browser' versionCode='13' versionName='1.0.12'"
          cp "$PHONE_DEBUG" Browser-1.0.12-ARM32-Debug-Signed.apk
          cp "$ARM64_DEBUG" Browser-1.0.12-ARM64-Debug-Signed.apk

      - name: Upload installable ARM32 APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.12-ARM32-Debug-Signed
          path: Browser-1.0.12-ARM32-Debug-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.12-ARM64-Debug-Signed
          path: Browser-1.0.12-ARM64-Debug-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload emulator APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.12-x86_64-Emulator-Debug
          path: app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Browser-unit-test-report
          path: app/build/reports/tests/testEmulatorDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  emulator-test:
    name: Browser runtime test on Android API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
          - api-level: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download emulator APK
        uses: actions/download-artifact@v7
        with:
          name: Browser-1.0.12-x86_64-Emulator-Debug
          path: ${{ runner.temp }}/browser-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and test Browser
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            bash scripts/run-browser-emulator-test.sh "$RUNNER_TEMP/browser-apk/app-emulator-debug.apk" "${{ matrix.api-level }}"

      - name: Upload emulator screenshots, Logcat, and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Browser-emulator-API-${{ matrix.api-level }}-${{ github.run_id }}
          path: artifacts/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14

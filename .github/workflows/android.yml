name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Browser APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI="$ANDROID_HOME/cmdline-tools/22.0/bin/android"
          test -x "$ANDROID_CLI"
          python3 -c "from pathlib import Path; import os; Path(os.environ['RUNNER_TEMP'] + '/android-sdk-licenses.txt').write_text('y\\n' * 1000)"
          "$ANDROID_CLI" --no-metrics sdk install --canary "platforms;android-37.0" "build-tools;37.0.0" platform-tools < "$RUNNER_TEMP/android-sdk-licenses.txt"

      - name: Run tests and build APKs
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleRelease

      - name: Verify ARM64-only APKs
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          apks = [
              "app/build/outputs/apk/debug/app-debug.apk",
              "app/build/outputs/apk/release/app-release-unsigned.apk",
          ]
          for apk in apks:
              with ZipFile(apk) as archive:
                  abis = sorted({
                      path.split("/")[1]
                      for path in archive.namelist()
                      if path.startswith("lib/")
                      and len(path.split("/")) > 2
                      and path.endswith(".so")
                  })
              if abis != ["arm64-v8a"]:
                  raise SystemExit(
                      f"{apk}: expected only arm64-v8a native libraries, found {abis}"
                  )
              print(f"{apk}: verified arm64-v8a only")
          PY

      - name: Upload installable debug ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-debug-APK-arm64-v8a
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-release-APK-arm64-v8a-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 14

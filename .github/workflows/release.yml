name: Browser Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Android CLI and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          command -v android
          android --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Generate one-time random signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="browser-release"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Browser Release, OU=Android, O=Browser, L=Unknown, ST=Unknown, C=US"
          chmod 600 app/release-key.jks

      - name: Build signed Release APK
        run: gradle --no-daemon clean :app:assemblePhoneRelease

      - name: Verify and upload signed ARM64 Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/phone/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-signature.txt
          cp "$APK" Browser-1.0.6-ARM64-Release-Signed.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.6-ARM64-Release-Signed-ONE-TIME-KEY
          path: |
            Browser-1.0.6-ARM64-Release-Signed.apk
            release-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: rm -f app/release-key.jks

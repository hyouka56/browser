name: Browser Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Android CLI and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          command -v android
          android --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Restore permanent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean :app:assemblePhoneRelease

      - name: Verify and upload signed ARM64 Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/phone/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-signature.txt
          cp "$APK" Browser-1.0.6-ARM64-Release-Signed.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.6-ARM64-Release-Signed
          path: |
            Browser-1.0.6-ARM64-Release-Signed.apk
            release-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing material
        if: always()
        run: rm -f app/release-key.jks

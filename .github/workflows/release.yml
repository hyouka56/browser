name: Browser Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Restore permanent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Build version 1.0.5 signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:assemblePhoneRelease

      - name: Verify package, version, ABI, and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/phone/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-signature.txt
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.search.browser"
          test "$("$APKANALYZER" manifest version-name "$APK")" = "1.0.5"
          test "$("$APKANALYZER" manifest version-code "$APK")" = "6"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              abis = sorted({
                  name.split('/')[1]
                  for name in z.namelist()
                  if name.startswith('lib/') and len(name.split('/')) > 2 and name.endswith('.so')
              })
          if abis != ['arm64-v8a']:
              raise SystemExit(f"Expected only arm64-v8a native libraries, found: {abis}")
          print(f"Verified native ABI: {abis[0]}")
          PY
          cp "$APK" Browser-1.0.5-ARM64-Release-Signed.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.5-ARM64-Release-Signed
          path: |
            Browser-1.0.5-ARM64-Release-Signed.apk
            release-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing material
        if: always()
        run: rm -f app/release-key.jks

name: Browser Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build persistently signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Install Android CLI and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          command -v android
          android --sdk="$ANDROID_HOME" sdk install --canary platforms/android-37.0 build-tools/37.0.0 platform-tools
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Restore and validate permanent signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required permanent signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          chmod 600 app/release-key.jks
          keytool -list -keystore app/release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build persistently signed ARM64 Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean :app:assembleArm64Release

      - name: Verify and prepare signed ARM64 Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/arm64/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys
          from zipfile import ZipFile
          apk = sys.argv[1]
          with ZipFile(apk) as archive:
              abis = sorted({p.split("/")[1] for p in archive.namelist() if p.startswith("lib/") and len(p.split("/")) > 2 and p.endswith(".so")})
          if abis != ["arm64-v8a"]:
              raise SystemExit(f"Expected only arm64-v8a, found {abis}")
          print(f"Verified native ABI: {abis}")
          PY
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.search.browser' versionCode='17' versionName='1.0.16'"
          # JDK 25 warns when apksigner's bundled Conscrypt provider loads native code
          # from the class path. Explicitly grant native access to unnamed modules.
          export JDK_JAVA_OPTIONS="--enable-native-access=ALL-UNNAMED"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-signature.txt
          unset JDK_JAVA_OPTIONS
          cp "$APK" Browser-1.0.16-ARM64-Release-Persistent-Signed.apk

      - name: Upload persistently signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Browser-1.0.16-ARM64-Release-Persistent-Signed
          path: |
            Browser-1.0.16-ARM64-Release-Persistent-Signed.apk
            release-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored signing material
        if: always()
        run: rm -f app/release-key.jks
